name: LUXORIA - verify fresh V3 interiors without duplicates

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/luxoria-home-v3-plan.yml

permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install pillow
          python -m py_compile tools/luxoria_home_assets_v3.py
          python -u tools/luxoria_home_assets_v3.py --mode plan
      - uses: actions/upload-artifact@v4
        with:
          name: luxoria-interior-v3-plan
          path: tmp/luxoria-home-extra-v3/plan.json
          if-no-files-found: error
          retention-days: 3
